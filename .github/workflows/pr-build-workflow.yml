name: PR Build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Gradle test task + --tests selector; empty runs the full build'
        required: false
        default: ''

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK
        uses: actions/setup-java@v1
        with:
          java-version: '8'
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle') }}
      - name: Build with Gradle
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            ./gradlew clean assemble ${{ inputs.test-filter }} --continue
          else
            ./gradlew clean build --continue
          fi
      - name: Test results summary
        if: always()
        run: |
          python3 - <<'EOF'
          import glob, re, xml.etree.ElementTree as ET
          from collections import Counter
          def skip_reason(cls, name, msg):
              if msg:
                  return msg
              rel = cls.replace('.', '/').split('$')[0] + '.java'
              for src in glob.glob('**/src/*/java/' + rel, recursive=True):
                  lines = open(src, encoding='utf-8', errors='replace').read().splitlines()
                  for i, l in enumerate(lines):
                      if re.search(r'\b' + re.escape(name) + r'\s*\(', l):
                          for j in range(i - 1, max(i - 6, -1), -1):
                              if '@Ignore' in lines[j]:
                                  return 'disabled upstream by %s at %s:%d' % (lines[j].strip(), src, j + 1)
                  for k, l in enumerate(lines):
                      if '@Ignore' in l:
                          return 'disabled upstream by class-level %s at %s:%d' % (l.strip(), src, k + 1)
              return 'no reason in report or source'
          total = Counter()
          reasons = Counter()
          mods = sorted({p.split('/build/test-results/')[0] for p in glob.glob('**/build/test-results/*/*.xml', recursive=True)})
          for mod in mods:
              c = Counter()
              for f in glob.glob(mod + '/build/test-results/*/*.xml'):
                  for tc in ET.parse(f).getroot().iter('testcase'):
                      c['tests'] += 1
                      if tc.find('failure') is not None or tc.find('error') is not None:
                          c['failed'] += 1
                          print('FAILED TEST: %s.%s' % (tc.get('classname'), tc.get('name')))
                      elif tc.find('skipped') is not None:
                          c['skipped'] += 1
                          why = skip_reason(tc.get('classname'), tc.get('name'), tc.find('skipped').get('message'))
                          reasons[why] += 1
                          print('SKIPPED TEST: %s.%s -- %s' % (tc.get('classname'), tc.get('name'), why))
                      else:
                          c['passed'] += 1
              total.update(c)
              print('TEST MODULE %s: tests=%d passed=%d failed=%d skipped=%d' % (mod, c['tests'], c['passed'], c['failed'], c['skipped']))
          print('TEST SUMMARY: tests=%d passed=%d failed=%d skipped=%d | skip reasons: %s' % (total['tests'], total['passed'], total['failed'], total['skipped'], '; '.join('%d x %s' % (n, w) for w, n in reasons.most_common()) or 'none'))
          EOF
      - name: Upload spring-security-core jar
        uses: actions/upload-artifact@v4
        with:
          name: spring-security-core
          path: |
            core/build/libs/spring-security-core-*.jar
            !core/build/libs/spring-security-core-*-sources.jar
            !core/build/libs/spring-security-core-*-javadoc.jar
          if-no-files-found: error
